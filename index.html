<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajit Tempo Service</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

header{
    background:#0f172a;
    color:white;
    text-align:center;
    padding:20px;
}

.hero{
    text-align:center;
    padding:40px 20px;
}

.hero h1{
    color:#0f172a;
    margin-bottom:10px;
}

.search-box{
    text-align:center;
    margin:20px;
}

.search-box input{
    width:350px;
    max-width:90%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
}

.trucks{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:20px;
}

.card{
    background:white;
    width:280px;
    padding:20px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.card h3{
    color:#2563eb;
    margin-bottom:15px;
}

.card button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:5px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-size:15px;
}

.card button:hover{
    background:#1d4ed8;
}

footer{
    background:#0f172a;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:30px;
}
</style>
</head>
<body>

<header>
    <h1>AJIT TEMPO SERVICE</h1>
    <p>Truck Document Management System</p>
</header>

<section class="hero">
    <h1>All Truck Documents in One Place</h1>
    <p>Click Vehicle Number to Open Documents</p>
</section>

<div class="search-box">
    <input type="text" id="search" placeholder="Search Vehicle Number">
</div>

<div class="trucks" id="truckContainer"></div>

<footer>
    © 2026 Ajit Tempo Service
</footer>

// =====================
// CREATE CARDS
// =====================

const container = document.getElementById("truckContainer");

for(let number in trucks){

container.innerHTML += `

<div class="card">
    <h3>${number}</h3>
    <button onclick="openDrive('${number}')">
        View Documents
    </button>
</div>

`;

}

// =====================
// OPEN DRIVE LINK
// =====================

function openDrive(number){
    window.open(trucks[number].drive, "_blank");
}

// =====================
// SEARCH
// =====================

document.getElementById("search").addEventListener("keyup",function(){

let value=this.value.toUpperCase();

document.querySelectorAll(".card").forEach(card=>{

let number=card.querySelector("h3").innerText.toUpperCase();

if(number.includes(value)){
card.style.display="block";
}else{
card.style.display="none";
}

});

});

</script>

</html>
